name: Function App Deployment

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.bicep'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18.x'

jobs:
  deploy-function:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4
      
      - name: 'Login to Azure'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: 'Get Function App Name'
        id: get-function-app
        uses: azure/CLI@v1
        with:
          inlineScript: |
            FUNCTION_APP_NAME=$(az functionapp list --resource-group dreamtracker --query "[0].name" --output tsv)
            echo "functionAppName=$FUNCTION_APP_NAME" >> $GITHUB_OUTPUT
      
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 'Resolve Project Dependencies Using Pip'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"
      
      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.get-function-app.outputs.functionAppName }}
          package: .
          scm-do-build-during-deployment: true
          enable-oryx-build: true 